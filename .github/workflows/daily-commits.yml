
name: Daily Contributions

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config user.name "AmirhosseinHonardoust"
          git config user.email "80884572+AmirhosseinHonardoust@users.noreply.github.com"

      - name: Create 10 commits
        run: |
          for i in {1..10}; do
            echo "Daily contribution $i - $(date -u)" >> daily-contributions.txt
            git add daily-contributions.txt
            git commit -m "Daily contribution $i"
          done

      - name: Push changes
        run: git push origin main
